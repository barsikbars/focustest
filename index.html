<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F7">
<title>Focússimo Sprint — 1 неделя</title>
<meta name="description" content="Фокуссимо Спринт — система планирования на 1 неделя: цель, инструменты, задачи, привычки, трекеры и аналитика.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F7;
  --ink:#2E2E2E;
  --white:#FFFFFF;
  /* Бедже (базовая) */
  --head:#E8DCD0;
  --head-ink:#574F44;
  --row:#FAF6F2;
  --row-hi:#FFFDFB;
  --chipbg:#F2EAE2;
  --accent:#2E6B8A;
  --muted:#6E675E;
  --line:#EAE0D1;
  --line-soft:#F1E9DD;
  --track:#EFE7DB;
  --focus:#E4D7C4;
  --ph:#BDB2A2;
  --chk-line:#D9CBB8;
  --star-off:#D9CDBC;
  --rm:#C9BEAC;
  --done-ink:#A39A8D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Montserrat',sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
  overscroll-behavior-y:none;
}
img{display:block}
button{font-family:inherit;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rowflash{0%{background:#F7EAD2}100%{}}

.app{max-width:640px;margin:0 auto;padding:14px 14px 92px}

/* ---------- логотип ---------- */
.hero{display:flex;justify-content:center;align-items:center;animation:rise .5s ease both}
.logo{width:min(62.4vw,216px);height:auto;margin:6px auto 0;display:block}

/* ---------- выбор недели ---------- */
.wk-pills{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:12px 0 2px;
  -webkit-overflow-scrolling:touch;
  user-select:none;-webkit-user-select:none;
}
.wk-pills::-webkit-scrollbar{display:none}
.wk{
  flex:none;min-width:64px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  border:1px solid var(--line);background:var(--white);
  border-radius:12px;padding:7px 10px 6px;
  font-family:'Montserrat',sans-serif;
  transition:background .15s,border-color .15s,opacity .15s;
}
.wk b{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.wk small{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;font-family:'Montserrat',sans-serif;text-transform:uppercase}
.wk.cur{background:var(--accent);border-color:var(--accent)}
.wk.cur b{color:#fff}
.wk.cur small{color:#fff}
.wk.lock{opacity:.45;cursor:default}
.wk:active{transform:scale(.96)}

/* ---------- панель спринта ---------- */
.weekbar{
  margin-top:12px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(46,46,46,.03),0 10px 24px rgba(46,46,46,.04);
  animation:rise .5s .05s ease both;
  user-select:none;-webkit-user-select:none;
}
.wb-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wb-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.wb-range{font-family:'Montserrat',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.wb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-ghost{
  border:1px solid var(--line);background:var(--white);color:var(--muted);
  border-radius:9px;padding:9px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  transition:background .15s,color .15s,border-color .15s;
}
.btn-ghost:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- навигация: спринт + 7 дней ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--white);
  border-top:1px solid var(--line);
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 0 calc(env(safe-area-inset-bottom) + 2px);
  box-shadow:0 -6px 18px rgba(46,46,46,.06);
  user-select:none;-webkit-user-select:none;
}
.nav::-webkit-scrollbar{display:none}
.nav .tab{
  flex:1 0 auto;min-width:44px;position:relative;
  border:none;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  padding:11px 3px 9px;color:var(--muted);
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  transition:color .15s;
}
.nav .tab.main{color:var(--accent)}
.nav .tab.past{color:var(--accent)}
.nav .tab.active{color:var(--accent)}
.nav .tab.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:20px;height:2px;border-radius:0 0 3px 3px;background:var(--accent);
}
.nav .tab.alt{background:var(--accent);color:#fff}
.nav .tab.alt.active::before{background:#fff}
.nav .tab.checked{background:var(--accent);color:#fff}
.nav .tab.checked.active::before{background:#fff}
.nav .tchk{position:absolute;top:5px;right:6px;width:11px;height:11px}
.nav .tchk path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.nav .tab + .nav .tab{position:relative}
.nav .tab + .nav .tab::after{content:'';position:absolute;left:-0.5px;top:50%;transform:translateY(-50%);width:1px;height:22px;background:var(--head);border-radius:1px}
.nav .tab:active{opacity:.65}

main{margin-top:16px}
.view{max-width:640px;margin:0 auto;animation:rise .3s ease both}
.view[hidden]{display:none}
#v-day .day-inner{transition:opacity .12s ease,transform .12s ease}
#v-day .day-inner.switch-out{opacity:0}
#v-day .day-inner.switch-out.dir-1{transform:translateX(28px)}
#v-day .day-inner.switch-out.dir-m1{transform:translateX(-28px)}
#v-day .day-inner.day-in .card{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}

/* ---------- карточки ---------- */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:14px;
  box-shadow:0 1px 2px rgba(46,46,46,.03),0 10px 24px rgba(46,46,46,.04);
}
.fin-card{max-width:440px;margin:14px auto 18px}
  .section-head{
  background:var(--head);
  font-family:'Montserrat',sans-serif;font-weight:600;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-ink);
  padding:11px 14px;
  display:flex;align-items:center;gap:8px;
  user-select:none;-webkit-user-select:none;
}
.sh-ic{display:inline-flex;color:var(--accent);flex:none}
.sh-ic svg{display:block}
.sh-badge{
  margin-left:auto;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:var(--white);border-radius:999px;padding:3px 10px;color:var(--accent);
}
.sh-in{
  flex:1;min-width:0;border:none;background:transparent;
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;
  padding:2px 4px;margin:-2px -4px;border-radius:6px;
  user-select:text;-webkit-user-select:text;
}
.sh-in:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}
.sh-in::placeholder{color:var(--ph)}
.kv{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-top:1px solid var(--line-soft);
  font-size:14.5px;
}
.kv:first-of-type{border-top:none}
.kv b{font-family:'Montserrat',sans-serif;font-weight:600}
.kv .accent{color:var(--accent)}
#v-sprint .kv{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
#v-sprint .kv b{font-weight:500}

/* ---------- кольцо прогресса ---------- */
.ring{position:relative;display:inline-block;flex:none}
.ring svg{display:block}
.ring .val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;color:var(--accent);
}
.week-progress{display:flex;align-items:center;gap:18px;padding:14px;flex-wrap:wrap}
.ring-big .val{font-size:24px;letter-spacing:-.02em}

/* строки «Неделя N» на главной: текст как в «Прогресс спринта» (.kv — 14.5px), полоса на всю ширину */
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft)}
.hrow:first-child{border-top:none}
.hrow-l{flex:none;width:92px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.hrow-bar{flex:1;height:12px;background:var(--track);border-radius:99px;overflow:hidden;display:block}
.hrow-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hrow-v{flex:none;width:52px;text-align:right;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);text-transform:uppercase}

/* ---------- задачи ---------- */
.task{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;min-height:46px;
  border-top:1px solid var(--line-soft);
  position:relative;z-index:1;touch-action:pan-y;
}
.task.flash{animation:rowflash 1.2s ease}
.chk{
  width:28px;height:28px;flex:none;
  border-radius:9px;border:1.5px solid var(--chk-line);background:var(--chipbg);
  display:grid;place-items:center;padding:0;
  transition:background .12s,border-color .12s;
}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{opacity:1;animation:pop .18s ease}
.task-in{
  flex:1;min-width:0;border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);text-transform:uppercase;
  padding:6px 2px;
}
.task-in:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}
.task-in::placeholder{color:var(--ph)}
.task.done .task-in{color:var(--done-ink);text-decoration:line-through}
.rmbtn{
  width:28px;height:28px;flex:none;border-radius:50%;
  border:1px solid transparent;background:transparent;
  color:var(--rm);font-size:16px;line-height:1;
  display:grid;place-items:center;transition:color .12s,border-color .12s;
}
.rmbtn:hover{color:var(--accent);border-color:var(--line)}

/* ---------- кнопки добавить ---------- */

/* ---------- лента дня ---------- */
.dayhead{
  display:flex;align-items:center;gap:12px;
  background:var(--head);padding:14px;
  user-select:none;-webkit-user-select:none;
}
.dayhead b{font-family:'Montserrat',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--accent)}
.dayhead .dh-sub{font-size:11px;font-weight:500;color:var(--head-ink);margin-top:2px;letter-spacing:.08em;text-transform:uppercase}
.dayhead .dh-done{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.08em;margin-top:3px;text-transform:uppercase}
.ring-dh{margin-left:auto;display:flex;align-items:center;justify-content:center}
.ring-dh.has-next{margin-right:8px}
.dh-next{width:52px;height:52px;flex:none;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.dh-next:active{transform:scale(.94)}
.ring-dh .ring .val{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}

.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){
  .dgrid{grid-template-columns:1.35fr 1fr;align-items:start}
  .dcol-side{display:grid;gap:14px}
}

/* ---------- привычки ---------- */
.hab-day{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:48px;border-top:1px solid var(--line-soft)}
.hab-day:first-of-type{border-top:none}
.hchk{
  width:32px;height:32px;border-radius:9px;flex:none;
  border:1.5px solid var(--chk-line);background:var(--chipbg);
  display:grid;place-items:center;padding:0;
  transition:background .12s,border-color .12s;
}
.hchk svg{width:17px;height:17px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.hchk.on{background:var(--accent);border-color:var(--accent)}
.hchk.on svg{opacity:1;animation:pop .18s ease}
.hab-name{
  flex:1;min-width:0;border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);text-transform:uppercase;
  padding:6px 2px;
}
.hab-name:focus{outline:none;background:var(--white);box-shadow:0 0 0 2px var(--focus)}

/* ---------- вечерние трекеры ---------- */
.tracker-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line-soft);font-size:14px;gap:10px;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.tracker-row:first-of-type{border-top:none}
.tracker-row .tl{color:var(--ink);display:flex;align-items:center;gap:8px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.tracker-row .tl svg{color:var(--accent)}
.tracker-row .tl-in{
  border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);text-transform:uppercase;
  width:118px;padding:2px 5px;margin:-2px -5px;border-radius:6px;
  user-select:text;-webkit-user-select:text;
}
.tracker-row .tl-in:focus{outline:none;background:var(--row);box-shadow:0 0 0 2px var(--focus)}
.week-progress .ring,.tri-rings .ring{width:min(116px,calc((100vw - 58px)/3))!important;height:min(116px,calc((100vw - 58px)/3))!important}
.week-progress .ring svg,.tri-rings .ring svg{width:100%!important;height:100%!important}
.tri-rings{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;padding:14px}
.tri-rings .ring .val{font-size:15px!important}
@media(min-width:640px){.tri-rings .ring .val{font-size:20px!important}}
.tri-cell{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.tri-lbl{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:center;max-width:116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{display:inline-flex;gap:2px}
.stars button{
  border:none;background:none;
  font-size:17px;line-height:1;color:var(--star-off);padding:3px 2px;
  transition:transform .1s,color .1s;
}
.stars button.on{color:var(--accent)}
.stars button:active{transform:scale(1.25)}
.sleep-wrap{display:flex;align-items:center;gap:7px;user-select:none;-webkit-user-select:none}
.sleep-wrap input{
  width:76px;border:1px solid var(--line);border-radius:9px;background:var(--row);
  font-family:'Montserrat',sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--ink);text-transform:uppercase;
  padding:8px 8px;text-align:center;
}
.sleep-wrap input:focus{outline:none;box-shadow:0 0 0 2px var(--focus)}
.sleep-wrap i{font-style:normal;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

/* ---------- дневник ---------- */
.jf-grid{display:grid;grid-template-columns:1fr;gap:0}
.jf{padding:12px 14px;border-top:1px solid var(--line-soft)}
.jf:first-of-type{border-top:none}
@media(min-width:640px){
  .jf-grid{grid-template-columns:1fr 1fr}
  .jf.jf-wide{grid-column:1 / -1}
}
.jf label{display:block;font-family:'Montserrat',sans-serif;font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.jf .jname{display:block;width:100%;border:none;background:none;outline:none;padding:0;margin-bottom:7px;font-family:'Montserrat',sans-serif;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.jf textarea{
  width:100%;border:none;background:var(--row);border-radius:10px;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink);text-transform:uppercase;
  padding:10px 12px;resize:vertical;min-height:48px;line-height:1.5;
}
.jf textarea:focus{outline:none;background:var(--row-hi);box-shadow:0 0 0 2px var(--focus)}
.jf textarea::placeholder{color:var(--ph)}

/* ---------- статистика спринта ---------- */
.ovgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){
  .ovgrid{grid-template-columns:1fr 1fr}
}

.btn-finish{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:9px;padding:9px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
.btn-finish:active{transform:scale(.98)}


/* ---------- оверлеи: календарь нового спринта и окно подтверждения ---------- */
.ovl{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:rgba(46,46,46,.42);display:flex;justify-content:center;align-items:flex-end;animation:fadein .18s ease both}
.ovl[hidden]{display:none}
.ovl-center{align-items:center;padding:20px}
.ovl-card{width:100%;max-width:420px;background:var(--white);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:rise .22s ease both}
.ovl-center .ovl-card{border-radius:18px;padding:18px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ovl-head b{display:block;font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.ovl-head b.fin-q{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ovl-text{font-size:11px;line-height:1.55;color:var(--muted);margin:8px 0 0;text-transform:uppercase}
.ovl-foot{display:flex;gap:8px;align-items:center;margin-top:14px}
.ovl-foot-end{justify-content:flex-end}
.btn-blue{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:9px 14px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:background .15s}
.btn-blue:disabled{opacity:.4}
.cal-start{flex:1;padding:12px 14px}
.btn-blue:active{transform:scale(.98)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:12px 0 8px}
.cal-ttl{font-size:13px;font-weight:600;letter-spacing:.04em}
.cal-ar{width:32px;height:32px;flex:none;border:1px solid var(--line);background:var(--white);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s}
.cal-ar:active{background:var(--row-hi)}
.cal-ar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-dow span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-d{min-height:38px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:9px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;color:var(--ink);transition:background .12s}
.cal-d:not(.blank):hover{background:var(--row-hi)}
.cal-d:not(.blank):active,.cal-d:not(.blank).sel{background:var(--accent);color:#fff;transition:none}
.cal-d.blank{visibility:hidden}
.cal-d.today{color:var(--accent);font-weight:600}
.weekbar.finish-ready #btnNew{background:var(--accent);border-color:var(--accent);color:#fff}
.weekbar.finish-ready #btnNew:active{background:var(--accent)}

/* ---------- тост ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;border-radius:999px;

function toISO(d){ return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function parseISO(s){ var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }

function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayOf(d){ var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); var wd=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-wd); return toISO(x); }

function weekStartISO(w){ return addDaysISO(state.sprintStart, w*7); }

  s.maxUnlocked = Math.min(WEEKS-1, Math.max(0, +s.maxUnlocked||0));
  var aw = +s.activeWeek;
  if(!(aw>=0 && aw<=s.maxUnlocked)) aw = s.maxUnlocked;
  s.activeWeek = aw;
  s.habits = Array.isArray(s.habits) && s.habits.length ? s.habits : d.habits;
  s.days = (Array.isArray(s.days) && s.days.length===WEEKS*7) ? s.days : d.days;
  for(var i=0;i<WEEKS*7;i++){
    var dd = s.days[i] || {};

/* ---------- Telegram CloudStorage: прогресс за аккаунтом пользователя ---------- */
var CS = (function(){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    return (tg && tg.CloudStorage) ? tg.CloudStorage : null;
  }catch(e){ return null; }
})();
var CS_PREFIX = LS_KEY; /* допустимые символы: A-Z a-z 0-9 _ - */
function csReadState(cb){
  if(!CS){ cb(null); return; }
  CS.getItem(CS_PREFIX+'_n', function(err, nStr){
    if(err || !nStr){ cb(null); return; }
    var n = +nStr;
    if(!(n>=1 && n<=1024)){ cb(null); return; }
    var parts = new Array(n), got = 0, failed = false;
    for(var i=0;i<n;i++){
      (function(i){
        CS.getItem(CS_PREFIX+'_c'+i, function(e, v){
          if(e || v==null) failed = true;
          parts[i] = (v==null) ? '' : v;
          if(++got===n) cb(failed ? null : parts.join(''));
        });
      })(i);
    }
  });
}
var csBusy = false, csQueued = null;
function csWriteState(str, done){
  if(!CS){ if(done) done(); return; }
  if(csBusy){ csQueued = str; return; }
  csBusy = true;
  var CH = 4000, n = Math.max(1, Math.ceil(str.length/CH));
  function finishWrite(err){
    csBusy = false;
    if(done) done(err);
    if(csQueued !== null){ var q = csQueued; csQueued = null; csWriteState(q, null); }
  }
  CS.getKeys(function(err, keys){
    var oldKeys = [];
    if(!err && keys){
      for(var i=0;i<keys.length;i++){
        var k = String(keys[i]);
        if(k.indexOf(CS_PREFIX+'_c')===0){
          var idx = parseInt(k.slice(CS_PREFIX.length+2), 10);
          if(!isNaN(idx) && idx>=n) oldKeys.push(k);
        }
      }
    }
    var pending = n + 1 + oldKeys.length, fin = false, hadErr = false;
    function tick(e){
      if(e) hadErr = true;
      if(--pending<=0 && !fin){ fin = true; finishWrite(hadErr ? 'cs' : null); }
    }
    for(var j=0;j<oldKeys.length;j++) CS.removeItem(oldKeys[j], tick);
    for(var c=0;c<n;c++){
      (function(c){ CS.setItem(CS_PREFIX+'_c'+c, str.substring(c*CH,(c+1)*CH), tick); })(c);
    }
    CS.setItem(CS_PREFIX+'_n', String(n), tick);
  });
}
var csTimer = null;
function save(){
  try{ state.__ts = Date.now(); localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  if(csTimer) clearTimeout(csTimer);

    csTimer = null;
    var s; try{ s = JSON.stringify(state); }catch(e){ return; }
    csWriteState(s, null);
  }, 800);
}
function csFlush(){
  if(!csTimer) return;
  clearTimeout(csTimer); csTimer = null;
  var s; try{ s = JSON.stringify(state); }catch(e){ return; }
  csWriteState(s, null);
}

/* ================= анимации диаграмм: заполнение при пролистывании ================= */
var animateView = false;
var chartObserver = null;
function ensureChartObserver(){
  if(chartObserver) return chartObserver;
  /* заполнение: переход от пустого значения к итоговому (после каждого кадра) */
  function triggerFill(el){
    requestAnimationFrame(function(){
      var d = el.getAttribute('data-delay') || '0';
      if(el.getAttribute('data-anim') === 'ring'){
        animateRing(el, parseFloat(el.getAttribute('data-off')) || 0, parseFloat(d) || 0);
      } else if(el.getAttribute('data-anim') === 'bar'){
        el.style.transition = 'width 1s cubic-bezier(.2,.8,.2,1) ' + d + 's';
        el.style.width = el.getAttribute('data-w');
      }
    });
  }
  /* заполняем, когда диаграмма попадает в видимую зону при скролле */
  if(!('IntersectionObserver' in window)){
    chartObserver = {
      observe: function(el){ triggerFill(el); },
      unobserve: function(){}, disconnect: function(){}
    };
    return chartObserver;
  }
  chartObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      chartObserver.unobserve(en.target);
      triggerFill(en.target);
    });
  }, {threshold: 0.15});
  return chartObserver;
}
/* анимация кольца: stroke-dashoffset меняем каждый кадр через атрибут (работает в любом WebView) */
function animateRing(ci, target, delay){
  var dash = parseFloat(ci.getAttribute('stroke-dasharray')) || 0;
  var start = dash;
  ci.style.transition = 'none';
  ci.setAttribute('stroke-dashoffset', String(start));
  var t0 = null, dur = 900;
  function step(ts){
    if(t0 === null) t0 = ts + delay*1000;
    if(ts < t0){ requestAnimationFrame(step); return; }
    var p = Math.min(1, (ts - t0) / dur);
    var e = 0.5 - 0.5*Math.cos(Math.PI*p);
    ci.setAttribute('stroke-dashoffset', String(start + (target - start)*e));
    if(p < 1) requestAnimationFrame(step);
    else ci.setAttribute('stroke-dashoffset', String(target));
  }
  requestAnimationFrame(step);
}
function animateCharts(root){
  var obs = ensureChartObserver();
  /* кольца прогресса: пустое значение, заполнение при появлении в видимую зону (атрибут — без CSS-переходов) */
  var rings = root.querySelectorAll('.ring svg circle[stroke-dasharray]');
  rings.forEach(function(ci, i){
    var off = parseFloat(ci.getAttribute('stroke-dashoffset')) || 0;
    var dash = parseFloat(ci.getAttribute('stroke-dasharray')) || 0;
    ci.style.transition = 'none';
    ci.setAttribute('stroke-dashoffset', String(dash));
    ci.setAttribute('data-anim', 'ring');
    ci.setAttribute('data-off', off);
    ci.setAttribute('data-delay', String(i*0.08));
    obs.observe(ci);
  });
  /* горизонтальные линии (полосы): заполнение — при скролле в видимую зону */
  var bars = root.querySelectorAll('.hrow-bar i');
  bars.forEach(function(b, i){
    var m = b.getAttribute('style').match(/width:\s*([\d.]+)%/);
    var target = m ? m[1]+'%' : '0%';
    b.style.transition = 'none';
    b.style.width = '0%';
    b.setAttribute('data-anim', 'bar');
    b.setAttribute('data-w', target);
    b.setAttribute('data-delay', String(i*0.09));
    obs.observe(b);
  });
}

       + '<div class="jf"><textarea data-loc="rt_next" rows="3" placeholder="Что я изменю в следующем спринте?">'+esc(state.retro.next)+'</textarea></div>'
       + '</div>';
  }

  /* статистика */
  h += '<div class="ovgrid">';

  h += '<div class="card">'
     + secHead('progress','progress')
     + '<div class="week-progress">'
     + '<div class="ring ring-big">'+ringHTML(t.pct,116,12,22)+'</div>'
     + '<div style="flex:1;min-width:150px">'
     + '<div class="kv"><span>Все задачи</span><b>'+t.non+'</b></div>'
     + '<div class="kv"><span>Готово</span><b class="accent">'+t.done+'</b></div>'
     + '<div class="kv"><span>В процессе</span><b>'+t.proc+'</b></div>'
     + '</div></div></div>';

  /* прогресс по неделям — горизонтальные столбцы */
  var wkVals=[];
  for(var wi=0;wi<WEEKS;wi++) wkVals.push(weekStats(wi).pct);
  h += '<div class="card">'
     + secHead('bars','taskWeeks')
     + '<div style="padding:10px 14px 14px">'+chartHBarsWeeks(wkVals, function(v){return v+'%';})+'</div>'
     + '</div>';

  /* аналитика всех привычек — горизонтальные столбцы */
  var habWeekMax = state.habits.length * 7;
  var habVals=[];
  for(var hw=0;hw<WEEKS;hw++){
    var hd=0;
    for(var hk=0;hk<state.habits.length;hk++){
      for(var hh=hw*7;hh<hw*7+7;hh++){ if(state.habits[hk].days[hh]) hd++; }
    }
    habVals.push(habWeekMax? Math.round(hd/habWeekMax*100) : 0);
  }
  h += '<div class="card">'
     + secHead('repeat','habWeeks')
     + '<div style="padding:10px 14px 14px">'+chartHBarsWeeks(habVals, function(v){return v+'%';})+'</div>'
     + '</div>';

  /* трекеры спринта — три кольца в ряд */
  (function(){
    var slSum=0, slCnt=0, enSum=0, enCnt=0, mdSum=0, mdCnt=0;
    for(var a=0;a<WEEKS*7;a++){
      var sv=sleepVal(a); if(sv>0){ slSum+=sv; slCnt++; }
      var ev=+state.days[a].energy||0; if(ev>0){ enSum+=ev; enCnt++; }
      var mv=+state.days[a].mood||0; if(mv>0){ mdSum+=mv; mdCnt++; }
    }
    var slA = slCnt? slSum/slCnt : null;
    var enP = enCnt? Math.round((enSum/enCnt)/5*100) : null;
    var mdP = mdCnt? Math.round((mdSum/mdCnt)/5*100) : null;
    var slTxt = slA? (Math.round(slA*10)/10).toString().replace('.',',')+'ч' : '—';
    var tri = '<div class="tri-rings">'
      + '<div class="tri-cell">'+ringVal(100,116,12,20, slTxt)+'<div class="tri-lbl">Сон</div></div>'
      + '<div class="tri-cell">'+ringVal(enP==null?0:enP,116,12,20, enP==null? '—' : enP+'%')+'<div class="tri-lbl">'+esc(tnName('energy'))+'</div></div>'
      + '<div class="tri-cell">'+ringVal(mdP==null?0:mdP,116,12,20, mdP==null? '—' : mdP+'%')+'<div class="tri-lbl">'+esc(tnName('mood'))+'</div></div>'
      + '</div>';
    h += '<div class="card">'+secHead('moon','trackers')+tri+'</div>';
  })();

  h += '</div>';

  document.getElementById('v-sprint').innerHTML = h;
  if(animateView){ animateCharts(document.getElementById('v-sprint')); animateView = false; }
}
function ringVal(pct, size, sw, fs, txt){
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  var r=(size-sw*2)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px">'
    + '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="'+sw+'" stroke-linecap="round" '
    + 'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')" style="transition:stroke-dashoffset .6s ease"/>'
    + '</svg><div class="val" style="font-size:'+fs+'px">'+txt+'</div></div>';
}
function chartHBarsWeeks(vals, fmt){
  var h='';
  for(var i=0;i<vals.length;i++){
    h += '<div class="hrow"><span class="hrow-l">Неделя '+(i+1)+'</span><span class="hrow-bar"><i style="width:'+vals[i]+'%"></i></span><b class="hrow-v">'+fmt(vals[i])+'</b></div>';
  }
  return h;
}

/* ================= ДЕНЬ ================= */
function renderDay(a){
  var d = state.days[a];
  var jn = state.journalNames;
  var s = dayStats(a);
  var w = weekOfAbs(a);
  var dayDone = s.non>0 && s.pct===100;

  var h='';
  h += '<div class="card">'
     + '<div class="dayhead">'
     + '<div><b>'+dayFull(a)+'</b><div class="dh-sub">'+fmtDayYear(a)+' · неделя '+(w+1)+' из '+WEEKS+'</div>'
     + (dayDone? '<div class="dh-done">День выполнен</div>':'')
     + '</div>'
     + '<div class="ring-dh'+(a<WEEKS*7-1?' has-next':'')+'">'+ringHTML(s.pct,52,5,11)+'</div>'

  h += '<div class="dgrid">';
  h += '<div class="dcol-main">';

    var tk = d.tasks[k];
    var lastT = (k === d.tasks.length-1);

      + '<button class="chk'+(tk.done?' on':'')+'" type="button" data-loc="d'+a+'t'+k+'c" aria-label="готово">'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></button>'
      + '<input class="task-in" data-loc="d'+a+'t'+k+'" value="'+esc(tk.t)+'" placeholder="Задача '+(k+1)+'">'
      + (lastT ? '<button class="rmbtn" type="button" data-add="task:'+a+'" aria-label="добавить задачу" title="Добавить задачу">+</button>' : '<button class="rmbtn" type="button" data-loc="d'+a+'t'+k+'x" aria-label="удалить">−</button>')
      + '</div>';
  }
  h += '<div class="card">'
     + secHead('tasks','dayTasks','<span class="sh-badge" id="taskBadge">'+s.done+'/'+s.non+'</span>')
     + '<div class="tasks-list">'+tasksH+'</div>'
     + '</div>';

  h += '</div>'; /* dcol-main */

  h += '<div class="dcol-side">';

  var habsH='';
  for(var hk=0;hk<state.habits.length;hk++){
    var hb = state.habits[hk];
    var lastH = (hk === state.habits.length-1);
    habsH += '<div class="hab-day">'
      + '<button class="hchk'+(hb.days[a]?' on':'')+'" type="button" data-loc="h'+hk+'d'+a+'" aria-label="привычка выполнена">'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></button>'
      + '<input class="hab-name" data-loc="h'+hk+'n" value="'+esc(hb.name)+'" placeholder="Название привычки">'
      + (lastH ? '<button class="rmbtn" type="button" data-add="habit" aria-label="добавить привычку" title="Добавить привычку">+</button>' : '<button class="rmbtn" type="button" data-loc="h'+hk+'x" aria-label="удалить">−</button>')
      + '</div>';
  }
  h += '<div class="card">'
     + secHead('repeat','dayHabits','<span class="sh-badge" id="habBadge">'+state.habits.filter(function(x){return x.days[a];}).length+'/'+state.habits.length+'</span>')
     + '<div class="habs-list">'+habsH+'</div>'
     + '</div>';

  h += '<div class="card">'
     + secHead('sun','dayMood')
     + '<div class="tracker-row"><span class="tl">'+ic('moon',15)+'Сон</span><span class="sleep-wrap"><input type="number" inputmode="decimal" step="0.5" min="0" max="15" data-loc="d'+a+'sl" value="'+esc(d.sleep)+'" placeholder="8" aria-label="часы сна"><i>ч</i></span></div>'
     + '<div class="tracker-row"><span class="tl">'+ic('bolt',15)+'<input class="tl-in" data-loc="tn_energy" value="'+esc(state.trackNames.energy)+'" maxlength="20" autocomplete="off" aria-label="Название трекера"></span>'+starPicker('d'+a+'e', d.energy)+'</div>'
     + '<div class="tracker-row"><span class="tl">'+ic('smile',15)+'<input class="tl-in" data-loc="tn_mood" value="'+esc(state.trackNames.mood)+'" maxlength="20" autocomplete="off" aria-label="Название трекера"></span>'+starPicker('d'+a+'m', d.mood)+'</div>'

  h += '</div>'; /* dcol-side */

  h += '<div class="card">'
    + secHead('book','journal')

    + '<div class="jf"><input class="jname" data-loc="jname_wisdom" value="'+esc(jn.wisdom)+'" maxlength="40" autocomplete="off" aria-label="Название раздела"><textarea data-loc="d'+a+'wi" rows="2" placeholder="Главный вывод дня">'+esc(d.wisdom)+'</textarea></div>'
    + '<div class="jf"><input class="jname" data-loc="jname_thanks" value="'+esc(jn.thanks)+'" maxlength="40" autocomplete="off" aria-label="Название раздела"><textarea data-loc="d'+a+'thk" rows="2" placeholder="За что благодарен(на)">'+esc(d.thanks)+'</textarea></div>'
    + '<div class="jf jf-wide"><input class="jname" data-loc="jname_thoughts" value="'+esc(jn.thoughts)+'" maxlength="40" autocomplete="off" aria-label="Название раздела"><textarea data-loc="d'+a+'tho" rows="3" placeholder="Мысли, идеи, заметки">'+esc(d.thoughts)+'</textarea></div>'
    + '</div></div>';

  document.getElementById('v-day').innerHTML = '<div class="day-inner">'+h+'</div>';

    if(row) row.classList.add('flash');
    window._flashKi = null;
  }
}
function updateDayDerived(a){
  var s = dayStats(a);
  function set(id, v){ var el=document.getElementById(id); if(el) el.textContent=v; }
  set('taskBadge', s.done+'/'+s.non);
  set('habBadge', state.habits.filter(function(x){return x.days[a];}).length+'/'+state.habits.length);
  var head=document.querySelector('#v-day .dayhead .ring-dh');
  if(head) head.innerHTML = ringHTML(s.pct,52,5,11);
  document.querySelectorAll('#v-day .task').forEach(function(row){
    var ki = +row.getAttribute('data-ki');
    var tk = state.days[a].tasks[ki];
    if(tk) row.classList.toggle('done', !!tk.done);
  });
}

/* ================= действия ================= */
function doAdd(kind){
  var parts = kind.split(':');
  var type = parts[0], a = +parts[1];
  if(type==='task'){
    if(state.days[a].tasks.length>=MAX_TASKS){ toast('Максимум '+MAX_TASKS+' задач на день'); return; }
    state.days[a].tasks.push(emptyTask());
    window._flashKi = state.days[a].tasks.length-1;
    save(); renderDay(a);
    var last = document.querySelectorAll('#v-day .task-in');
    if(last.length) last[last.length-1].focus();
    return;
  }
  if(type==='habit'){
    if(state.habits.length>=MAX_HABITS){ toast('Максимум '+MAX_HABITS+' привычек'); return; }
    var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
    state.habits.push({name:'', days:arr});
    save();
    if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + +curView.charAt(1));
    var all = document.querySelectorAll('#v-day .hab-name');
    if(all.length) all[all.length-1].focus();
    return;
  }
}
function doRemove(loc){
  var m;
  if((m=loc.match(/^d(\d+)t(\d+)x$/))){
    var i=+m[1], k=+m[2], t=state.days[i].tasks[k];
    var doIt = function(){
      state.days[i].tasks.splice(k,1);
      save(); renderDay(i); buildNav();
    };
    if(String(t.t).trim()){ askConfirm('Удалить задачу?', 'Задача будет удалена без возможности восстановления.', 'Удалить', doIt); } else { doIt(); }
    return;
  }
  if((m=loc.match(/^h(\d+)x$/))){
    var hk=+m[1], hb=state.habits[hk];
    var used=hb.days.some(Boolean);
    var doItH = function(){
      state.habits.splice(hk,1);
      if(!state.habits.length){
        var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
        state.habits.push({name:'',days:arr});
      }
      save(); buildNav(); if(curView==='sp') renderSprint(); else renderDay(state.activeWeek*7 + +curView.charAt(1));
    };
    if(String(hb.name).trim()||used){ askConfirm('Удалить привычку?', 'Привычка и её отметки будут удалены без возможности восстановления.', 'Удалить', doItH); } else { doItH(); }
    return;
  }
}

/* ================= события ================= */
document.addEventListener('input', function(e){
  var el = e.target;
  if(!el || !el.dataset || !el.dataset.loc) return;
  var loc = el.dataset.loc, v = el.value;
  var m;
  if(loc==='goal'){ state.goal = v; }
  else if(loc==='tools'){ state.tools = v; }
  else if(loc==='rt_good'){ state.retro.good = v; }
  else if(loc==='rt_bad'){ state.retro.bad = v; }
  else if(loc==='rt_next'){ state.retro.next = v; }
  else if((m=loc.match(/^d(\d+)t(\d+)$/))){ state.days[+m[1]].tasks[+m[2]].t = v; }
  else if((m=loc.match(/^d(\d+)sl$/))){ state.days[+m[1]].sleep = v; }
  else if((m=loc.match(/^d(\d+)(wi|thk|tho)$/))){
    var f={'wi':'wisdom','thk':'thanks','tho':'thoughts'};
    state.days[+m[1]][f[m[2]]] = v;
  }
  else if((m=loc.match(/^h(\d+)n$/))){ state.habits[+m[1]].name = v; }
  else if(loc==='tn_energy'){ state.trackNames.energy = v; }
  else if(loc==='tn_mood'){ state.trackNames.mood = v; }
  else if((m=loc.match(/^jname_(wisdom|thanks|thoughts)$/))){ state.journalNames[m[1]] = v; }
  else if((m=loc.match(/^sn_(goal|tools|finish|progress|taskWeeks|habWeeks|trackers|dayTasks|dayHabits|dayMood|journal)$/))){ state.secNames[m[1]] = v; }
  else return;
  save();
  if(curView!=='sp') updateDayDerived(state.activeWeek*7 + +curView.charAt(1));
});

function haptic(kind){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    if(tg && tg.HapticFeedback){
      if(kind==='success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(kind||'light');
    }
  }catch(e){}
}

document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;

  var tab = t.closest('.nav .tab');
  if(tab){ setView(tab.getAttribute('data-view')); return; }

  var wk = t.closest('.wk');
  if(wk){ setActiveWeek(+wk.getAttribute('data-w')); return; }

  var nx = t.closest('.dh-next');
  if(nx){
    var na = +nx.getAttribute('data-nextday');
    if(na%7 < 6){ setView('d'+(na%7+1)); }
    else {
      var nw = state.activeWeek+1;
      if(nw <= state.maxUnlocked){ setActiveWeek(nw); setView('d0'); }
      else { toast('Неделя '+(nw+1)+' ещё закрыта — поставьте галочку в последний день недели'); }
    }
    return;
  }

  var add = t.closest('[data-add]');
  if(add){ doAdd(add.getAttribute('data-add')); return; }

  var rm = t.closest('.rmbtn');
  if(rm){ doRemove(rm.dataset.loc); return; }

  var chk = t.closest('.chk, .hchk');
  if(chk){
    var loc = chk.dataset.loc;
    var on = !chk.classList.contains('on');
    chk.classList.toggle('on', on);
    haptic('light');
    var m;
    if((m=loc.match(/^d(\d+)t(\d+)c$/))){
      state.days[+m[1]].tasks[+m[2]].done = on;
      document.querySelectorAll('#v-day .task[data-ki="'+m[2]+'"]').forEach(function(r){ r.classList.toggle('done', on); });
      save(); updateDayDerived(state.activeWeek*7 + +curView.charAt(1));
      buildNav();
      updateFinishBtn();
      if(on && (+m[1])%7===6){
        var wu = weekOfAbs(+m[1]);
        if(wu+1 <= WEEKS-1 && wu+1 > state.maxUnlocked){
          state.maxUnlocked = wu+1;
          save();
          buildWeekPills();
          if(curView==='sp') renderSprint();
          toast('Неделя '+(wu+2)+' открыта — так держать!');
        }
      }
    } else if((m=loc.match(/^h(\d+)d(\d+)$/))){
      state.habits[+m[1]].days[+m[2]] = on;
      var a=+m[2];
      if(on && a%7===6){
        var wu2 = weekOfAbs(a);
        if(wu2+1 <= WEEKS-1 && wu2+1 > state.maxUnlocked){
          state.maxUnlocked = wu2+1;
          save();
          buildWeekPills();
          if(curView==='sp') renderSprint();
          toast('Неделя '+(wu2+2)+' открыта — так держать!');
        }
      }
      document.querySelectorAll('.hchk[data-loc="'+loc+'"]').forEach(function(n){ n.classList.toggle('on', on); });
      save(); buildNav(); updateFinishBtn(); if(curView==='sp') renderSprint(); else updateDayDerived(a);
    }
    return;
  }

  var star = t.closest('.stars button');
  if(star){
    var sloc = star.dataset.loc;
    var sm = sloc.match(/^d(\d+)([em])(\d)$/);
    if(sm){
      var di=+sm[1], key = sm[2]==='e'?'energy':'mood', k=+sm[3];
      var nv = state.days[di][key]===k ? 0 : k;
      state.days[di][key] = nv;
      haptic('light');
      save();
      var cont = star.parentElement;
      if(cont && cont.querySelectorAll){
        cont.querySelectorAll('button').forEach(function(b, bi){
          b.classList.toggle('on', bi < nv);
        });
        cont.setAttribute('aria-valuenow', String(nv));
      }
      if(curView==='d'+(di%7)) updateDayDerived(di);
    }
    return;
  }
});

/* ---------- свайп между днями (в пределах недели) ---------- */
(function(){
  var panel = document.getElementById('v-day');
  var sx=0, sy=0, tracking=false;
  panel.addEventListener('pointerdown', function(e){
    if(e.target.closest('input,textarea,button')) return;
    if(curView==='sp') return;
    tracking=true; sx=e.clientX; sy=e.clientY;
  });
  panel.addEventListener('pointerup', function(e){
    if(!tracking) return; tracking=false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.3) return;
    var i = +curView.charAt(1);
    var n = dx < 0 ? Math.min(6, i+1) : Math.max(0, i-1);
    setView('d'+n);
  });
  panel.addEventListener('pointercancel', function(){ tracking=false; });

})();

/* ---------- новый спринт: календарь в приложении (браузер, телефон, Telegram) ---------- */
var calOvl = document.getElementById('calOvl');
var calGrid = document.getElementById('calGrid');
var calTitle = document.getElementById('calTitle');
var calGoBtn = document.getElementById('calGo');
var calY = 0, calM = 0, calSel = null;

function calMonthFull(iso){
  var d = parseISO(iso);
  return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}
function calRender(){
  calTitle.textContent = MONTHS_GEN[calM] + ' ' + calY;
  var off = (new Date(Date.UTC(calY, calM, 1)).getUTCDay() + 6) % 7;
  var dim = new Date(Date.UTC(calY, calM + 1, 0)).getUTCDate();
  var t = todayISO();
  var h = '';
  for(var b = 0; b < off; b++) h += '<span class="cal-d blank"></span>';
  for(var d = 1; d <= dim; d++){
    var iso = calY + '-' + String(calM + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var cls = 'cal-d' + (iso === t ? ' today' : '') + (iso === calSel ? ' sel' : '');
    h += '<button class="' + cls + '" type="button" data-cal="' + iso + '">' + d + '</button>';
  }
  calGrid.innerHTML = h;
}
function calNav(delta){
  calM += delta;
  if(calM < 0){ calM = 11; calY--; }
  if(calM > 11){ calM = 0; calY++; }
  calRender();
}
function openCal(){
  var now = parseISO(todayISO());
  calY = now.getUTCFullYear();
  calM = now.getUTCMonth();
  calSel = null;
  calRender();
  calGoBtn.disabled = true;
  calOvl.hidden = false;
}
function closeCal(){
  calOvl.hidden = true;
  calSel = null;
}
function calSelected(iso){
  calSel = iso;
  calGoBtn.disabled = false;
  var cells = calGrid.querySelectorAll('.cal-d');
  for(var ci=0;ci<cells.length;ci++){ cells[ci].classList.toggle('sel', cells[ci].getAttribute('data-cal')===iso); }
}
function calStart(){
  if(!calSel) return;
  var d = calSel;
  if(d === state.sprintStart){
    closeCal();
    toast('Спринт уже начинается с этой даты');
    return;
  }
  closeCal();
  askConfirm('Начать новый спринт с ' + calMonthFull(d) + '?', 'Данные спринта (цель, инструменты, задачи, дневник, итоги) будут очищены. Имена привычек и названия блоков сохранятся.', 'Начать', function(){ startSprintOn(d); });
}
function doFinish(){
  state.finished = 'pending';
  save();
  setView('sp');
  toast('Спринт завершён — подведите итоги');
  var fEl = document.querySelector('.fin-card');
  if(fEl && fEl.scrollIntoView) fEl.scrollIntoView({behavior:'smooth', block:'start'});
}
function startSprintOn(date){
  state.sprintStart = date;
  state.goal = '';
  state.tools = '';
  state.finished = null;
  state.retro = {good:'',bad:'',next:''};
  var days=[];
  for(var a=0;a<WEEKS*7;a++) days.push(defDay());
  state.days = days;
  state.habits = state.habits.map(function(hb){
    var arr=[]; for(var z=0;z<WEEKS*7;z++) arr.push(false);
    return {name:hb.name, days:arr};
  });
  state.maxUnlocked = 0;
  state.activeWeek = 0;
  save();
  document.getElementById('weekLabel').textContent = sprintRangeLabel();
  buildNav();
  buildWeekPills();
  setView('sp');
  haptic('success');
  toast('Новый спринт начат: ' + fmtShort(date));
}
document.getElementById('btnNew').addEventListener('click', openCal);
calGrid.addEventListener('click', function(e){
  var tg = e.target;
  if(!tg || !tg.getAttribute) return;
  var iso = tg.getAttribute('data-cal');
  if(iso) calSelected(iso);
});
document.getElementById('calPrev').addEventListener('click', function(){ calNav(-1); });
document.getElementById('calNext').addEventListener('click', function(){ calNav(1); });
document.getElementById('calGo').addEventListener('click', calStart);
calOvl.addEventListener('click', function(e){ if(e.target === calOvl) closeCal(); });
document.getElementById('btnFinish').addEventListener('click', function(){
  askConfirm('Завершить спринт?', 'На главной странице появится блок «Итоги спринта». Все данные сохранены — они будут очищены при старте нового спринта.', 'Завершить', doFinish);
  askTitle.classList.add('fin-q');
});
askYes.addEventListener('click', function(){ var cb = askCb; askClose(); if(cb) cb(); });
askNo.addEventListener('click', askClose);
askOvl.addEventListener('click', function(e){ if(e.target === askOvl) askClose(); });
document.addEventListener('keydown', function(e){ if(e && e.key === 'Escape'){ closeCal(); askClose(); } });

/* ---------- тост ---------- */
var toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
}

/* ---------- Telegram Mini App ---------- */
try{
  if(window.Telegram && window.Telegram.WebApp){
    var tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    try{ tg.setHeaderColor('#F7F7F7'); }catch(e2){}
  }
}catch(e){}

/* ---------- старт ---------- */
buildNav();
buildWeekPills();
document.getElementById('weekLabel').textContent = sprintRangeLabel();
setView('sp');
cloudSync();
</script>
